name: Generate Snake Animation

# Змейка лежит прямо в репозитории (assets/dist), как в старой версии.
# Обновляется при каждом твоём пуше и раз в неделю.
# История репозитория не стирается: обычный коммит, без force-push.

on:
  push:
    branches: [ main ]
    paths-ignore: [ "assets/dist/**" ]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c4b5fd&color_dots=#161b22,#2e1f4d,#4c2f80,#7048b6,#a78bfa

      - name: Commit snake if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dist
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update snake animation"
          git pull --rebase origin main
          git push origin HEAD:main
